<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8"><title>Notenrechner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="shortcut icon" href="Screenshot 2026-11-05 111538.png" type="image/x-icon" />
    <style>
      :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
      --bg:#f3f4f6;--card:#fff;--tx:#1d2125;--mu:#6b7280;--bd:#dfe2e6;--ac:#2e7d5b;--ok:#2e9a2e;--bad:#e53935;--grid:#e5e7eb;--sh:0 1px 3px rgba(0,0,0,.08)}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111315;--card:#1b1e22;--tx:#e8eaed;--mu:#9aa0a6;--bd:#33373d;--grid:#2d3036;--ok:#4cc24c;--bad:#ff6b66;--sh:none}}
      html{scroll-padding-top:env(safe-area-inset-top,0px)}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:16px;max-width:1200px;margin-inline:auto}
      h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 10px}h3{margin:0 0 10px}
      .sub{color:var(--mu);margin:0 0 16px;font-size:.9rem}
      .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
      .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
      .hint{color:var(--mu);font-size:.8rem;margin:8px 0}
      .ok{color:var(--ok)}.bad{color:var(--bad)}
      button{font:inherit;color:var(--tx);cursor:pointer}
      .b{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-size:.88rem}
      .b:hover{border-color:var(--ac)}.b.pri{background:var(--ac);border-color:var(--ac);color:#fff}.b.dan{color:var(--bad);border-color:var(--bad)}
      .ib{background:none;border:none;color:var(--mu);width:26px;height:26px;border-radius:6px;font-size:.95rem;padding:0}
      .ib:hover{background:var(--bg)}.ib.x{color:var(--bad)}.ib.ask{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:.75rem}
      input[type=text],input[type=number],select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}
      input[type=checkbox]{accent-color:var(--ac)}
      /* Durchschnitte */
      .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:12px}
      .t{position:relative;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:var(--bg)}
      .t span{display:block;color:var(--mu);font-size:.8rem;font-weight:600;padding-right:56px}
      .t b{display:block;font-size:1.8rem;margin:2px 0}.t small{color:var(--mu)}
      .tb{position:absolute;top:6px;right:6px;display:flex;gap:2px}
      /* Diagramm */
      .avg{text-align:center;font-style:italic;margin:0 0 8px}
      .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
      .chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.85rem}
      .chip.on{background:var(--c,var(--ac));border-color:var(--c,var(--ac));color:#fff}
      .chip.grp{font-weight:600;border-style:dashed}.chip.grp.on{background:var(--ac);border-color:var(--ac)}
      .ck:has(input:checked){background:var(--ac);border-color:var(--ac);color:#fff}
      .sw{font-size:.85rem;color:var(--mu);display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
      .chart{position:relative;height:400px}
      details{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}summary{cursor:pointer;font-weight:600}
      .kc{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}.kc ul{margin:6px 0 0;padding-left:18px}
      .verd{margin-top:12px;font-weight:700}
      /* Tabelle */
      .scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
      th,td{padding:6px;text-align:center;border-bottom:1px solid var(--bd);font-size:.9rem;white-space:nowrap}
      th{color:var(--mu);font-weight:600}td.nm,th.nm{text-align:left;font-weight:600}
      .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
      td input{width:64px;text-align:center}td.a,td.z{font-weight:700}
      .ex{display:inline-flex;align-items:center;gap:8px}
      #newN{width:200px}
      /* Presets */
      .pl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
      .pl small{color:var(--mu)}
      /* Popup */
      #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
      #modal.open{display:flex}
      .md{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
      .md label.fl{display:block;font-size:.85rem;color:var(--mu)}.md label.fl input{display:block;width:100%;margin-top:4px}
      .mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
    </style>
  </head>
<body>
<h1>Notenrechner</h1>
<p class="sub">Noten eintragen, Durchschnitte und Zeugnisnoten ansehen, Kompensationen prüfen.</p>

<div class="card">
  <h2>Durchschnitte</h2>
  <div class="tiles" id="tiles"></div>
  <button class="b" id="addAvg">+ Durchschnitt hinzufügen</button>
</div>

<div class="card">
  <p class="avg" id="avgTxt"></p>
  <div class="chips" id="chips"></div>
  <label class="sw" style="margin-right:16px"><input type="checkbox" id="multi"> Mehrere Fächer gleichzeitig vergleichen</label>
  <label class="sw" style="margin-right:16px"><input type="checkbox" id="tot"> Gesamtbewertung anzeigen</label>
  <label class="sw"><input type="checkbox" id="lim"> Linie bei 4.0 anzeigen</label>
  <div class="chart"><canvas id="cv"></canvas></div>
  <details><summary>Kompensationen anzeigen</summary><div id="komp"></div></details>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <h2 style="margin:0">Noten</h2>
    <span class="ex">Prüfungen: <button class="b" id="exMin">−</button><b id="exN"></b><button class="b" id="exPlus">+</button></span>
  </div>
  <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div class="row" style="margin-top:12px"><input type="text" id="newN" maxlength="14" placeholder="Neues Fach, z. B. M123"><button class="b" id="addSub">Fach hinzufügen</button></div>
  <div style="margin-top:12px"><button class="b dan" id="reset">Zurücksetzen</button></div>
</div>

<div class="card">
  <h2>Presets</h2>
  <p class="hint">Ein Preset enthält Fächer, Durchschnitte und die Anzahl Prüfungen (auf Wunsch auch die Noten). Jedes Preset hat einen Namen.</p>
  <div class="row">
    <button class="b pri" id="pSave">Aktuelles Preset speichern</button>
    <button class="b" id="pFile">Datei laden</button>
    <button class="b" id="pDir">Ordner wählen</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" multiple hidden>
  <input type="file" id="dirIn" webkitdirectory multiple hidden>
  <p class="hint" id="pmsg"></p>
  <div id="plist"></div>
</div>
<div id="modal"></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const r1=v=>Math.round(+v*10)/10;
const f1=v=>v===null?"–":v.toFixed(1);
const mean=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;
const cl=v=>v===null?"":r1(v)>=4?"ok":"bad";
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- Zustand ---------- */
const KEY="noten_v2",PKEY="noten_presets";
const INIT={DE:[3.9,4.7],EN:[5.1],FR:[3.2],FRW:[6],GP:[5.5],"IPT-1":[3.3],M117:[4.7],M122:[4.9],M162:[4.4],M319:[4.9],MA:[5.4],SP:[4],U187:[],WR:[5]};
const DEF_A=["DE","EN","FR","FRW","GP","MA","WR"],DEF_B=["IPT-1","M117","M122","M162","M319"];
let S;
function hex(h,sa,l){sa/=100;l/=100;const k=n=>(n+h/30)%12,a=sa*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const colorFor=k=>hex((k*137.508)%360,k%2?70:75,[42,52,35][k%3]);   // jede Farbe kommt nur einmal vor
function addSubject(name,g=[]){const s={id:uid(),name,g:[...g],color:colorFor(S.nc++)};S.subjects.push(s);return s}
const blank=()=>({nc:0,exams:4,subjects:[],avgs:[],view:{sel:[],multi:false},komp:{avg:"",off:[]}});
function starter(){S=blank();Object.entries(INIT).forEach(([n,g])=>addSubject(n,g));
  const ids=l=>S.subjects.filter(s=>l.includes(s.name)).map(s=>s.id);
  S.avgs=[{id:uid(),name:"FMZ",subs:ids(DEF_A)},{id:uid(),name:"BBZW",subs:ids(DEF_B)}];
  S.view.sel=ids(["DE"]);S.komp.avg=S.avgs[0].id}
function migrate(){try{const o=JSON.parse(localStorage.getItem("noten_v1")||"null");if(!o||!o.data)return false;
  S=blank();Object.keys(o.data).forEach(n=>addSubject(n,o.data[n].map(x=>x.g)));
  const ids=l=>S.subjects.filter(s=>(l||[]).includes(s.name)).map(s=>s.id);
  if((o.fmz||[]).length)S.avgs.push({id:uid(),name:"FMZ",subs:ids(o.fmz)});
  if((o.bbzw||[]).length)S.avgs.push({id:uid(),name:"BBZW",subs:ids(o.bbzw)});
  (o.custom||[]).forEach(c=>S.avgs.push({id:uid(),name:c.name,subs:ids(c.subs)}));
  S.view.sel=ids((o.sel||[]).slice(0,1));S.komp.avg=S.avgs[0]?S.avgs[0].id:"";return true}catch(e){return false}}
try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!S.subjects){if(!migrate())starter()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function sync(){const ids=S.subjects.map(s=>s.id);
  S.avgs.forEach(a=>a.subs=a.subs.filter(i=>ids.includes(i)));
  S.view.sel=S.view.sel.filter(i=>ids.includes(i));S.komp.off=S.komp.off.filter(i=>ids.includes(i));
  if(S.komp.avg&&!S.avgs.some(a=>a.id===S.komp.avg)){S.komp.avg="";S.komp.off=[]}}

/* ---------- Berechnungen ---------- */
const gv=(s,i)=>{const v=s.g[i];return v===""||v==null||isNaN(+v)?null:r1(v)};
const gr=s=>Array.from({length:S.exams},(_,i)=>gv(s,i));
const avgS=s=>mean(gr(s).filter(v=>v!==null));
const zn=s=>{const a=avgS(s);return a===null?null:Math.round(a*2)/2};
const subsOf=a=>a.subs.map(id=>S.subjects.find(s=>s.id===id)).filter(Boolean);
const avgA=a=>mean(subsOf(a).map(avgS).filter(v=>v!==null));
const mangelA=a=>r1(subsOf(a).reduce((p,s)=>{const z=zn(s);return p+(z!==null&&z<4?4-z:0)},0));

/* ---------- Popup ---------- */
const closeM=()=>$("modal").classList.remove("open");
function modal(title,body,btns){const m=$("modal");m.innerHTML='<div class="md"><h3>'+title+'</h3>'+body+'<div class="mbtns"></div></div>';
  btns.forEach(b=>{const e=document.createElement("button");e.className="b "+(b.cls||"");e.textContent=b.t;e.onclick=()=>{if(!b.fn||b.fn()!==false)closeM()};m.querySelector(".mbtns").appendChild(e)});
  m.classList.add("open");const i=m.querySelector("input[type=text]");if(i)i.focus()}
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
function twoStep(b,label,fn){if(b.dataset.ask){fn();return}b.dataset.ask="1";const old=b.textContent;b.textContent=label;b.classList.add("ask");
  setTimeout(()=>{delete b.dataset.ask;b.textContent=old;b.classList.remove("ask")},3000)}

/* ---------- Durchschnitte ---------- */
function tiles(){
  $("tiles").innerHTML=S.avgs.map(a=>{const v=avgA(a),m=mangelA(a);
    return'<div class="t"><div class="tb"><button class="ib" data-e="'+a.id+'" title="Bearbeiten">⋮</button><button class="ib x" data-d="'+a.id+'" title="Löschen">✕</button></div><span>'+esc(a.name)+'</span><b class="'+cl(v)+'">'+f1(v)+'</b>'+(a.mp===false?"":'<small>Mangelpunkte: <i class="'+(m>0?"bad":"ok")+'">'+m.toFixed(1)+'</i></small>')+'</div>'}).join("")
    ||'<p class="hint">Noch kein Durchschnitt angelegt.</p>'}
$("tiles").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)avgModal(S.avgs.find(a=>a.id===b.dataset.e));
  else if(b.dataset.d)twoStep(b,"Löschen?",()=>{S.avgs=S.avgs.filter(a=>a.id!==b.dataset.d);upd()})};
$("addAvg").onclick=()=>avgModal(null);
function avgModal(a){const cur=a?a.subs:[];
  const body='<label class="fl">Name<input type="text" id="aN" maxlength="20" placeholder="z. B. Module" value="'+esc(a?a.name:"")+'"></label>'
   +'<p class="hint">Fächer, die in diesen Durchschnitt zählen:</p><div class="chips" id="aS">'
   +(S.subjects.map(s=>'<label class="chip ck"><input type="checkbox" value="'+s.id+'"'+(cur.includes(s.id)?" checked":"")+'> '+esc(s.name)+'</label>').join("")||'<span class="hint">Lege zuerst Fächer an.</span>')
   +'</div><div class="row"><button class="b" id="aAll">Alle</button><button class="b" id="aNone">Keine</button></div><p><label><input type="checkbox" id="aMp"'+(!a||a.mp!==false?" checked":"")+'> Mangelpunkte anzeigen</label></p><p class="bad" id="aErr"></p>';
  modal(a?"Durchschnitt bearbeiten":"Durchschnitt hinzufügen",body,[{t:"Abbrechen"},{t:a?"Speichern":"Hinzufügen",cls:"pri",fn:()=>{
    const name=$("aN").value.trim(),subs=[...document.querySelectorAll("#aS input:checked")].map(x=>x.value);
    if(!name){$("aErr").textContent="Bitte einen Namen eingeben.";return false}
    if(!subs.length){$("aErr").textContent="Bitte mindestens ein Fach wählen.";return false}
    const mp=$("aMp").checked;if(a){a.name=name;a.subs=subs;a.mp=mp}else S.avgs.push({id:uid(),name,subs,mp});upd()}}]);
  const all=v=>document.querySelectorAll("#aS input").forEach(x=>x.checked=v);
  $("aAll").onclick=()=>all(true);$("aNone").onclick=()=>all(false)}

/* ---------- Diagramm ---------- */
let chart;
const endLabels={id:"endLabels",afterDatasetsDraw(c){
  const ctx=c.ctx,y=c.scales.y,items=[];
  c.data.datasets.forEach(d=>{if(d.isLimit||d.avg==null)return;let li=-1;d.data.forEach((v,i)=>{if(v!==null)li=i});
    if(li>=0)items.push({y:y.getPixelForValue(d.data[li]),name:d.name,col:d.borderColor,avg:d.avg})});
  items.sort((a,b)=>a.y-b.y);for(let i=1;i<items.length;i++)if(items[i].y<items[i-1].y+22)items[i].y=items[i-1].y+22;
  const multi=items.length>1,x=c.chartArea.right+10;ctx.save();ctx.textBaseline="middle";
  items.forEach(it=>{let px=x;
    if(multi){ctx.font="600 14px system-ui,sans-serif";ctx.fillStyle=it.col;ctx.fillText(it.name,px,it.y);px+=ctx.measureText(it.name+" ").width}
    ctx.font="700 18px system-ui,sans-serif";ctx.fillStyle=r1(it.avg)>=4?css("--ok"):css("--bad");ctx.fillText(it.avg.toFixed(1),px,it.y)});
  ctx.restore()}};
function chips(){
  const c=$("chips");c.innerHTML="";$("multi").checked=S.view.multi;$("tot").checked=S.view.total!==false;
  const add=(t,on,col,fn,extra)=>{const b=document.createElement("button");b.className="chip"+(on?" on":"")+(extra||"");b.textContent=t;if(col)b.style.setProperty("--c",col);b.onclick=fn;c.appendChild(b)};
  const same=l=>l.length&&l.length===S.view.sel.length&&l.every(i=>S.view.sel.includes(i));
  add("Alle",same(S.subjects.map(s=>s.id)),null,()=>{S.view.sel=S.subjects.map(s=>s.id);upd()}," grp");
  S.avgs.forEach(a=>add(a.name,same(a.subs),null,()=>{S.view.sel=[...a.subs];upd()}," grp"));
  S.subjects.forEach(s=>add(s.name,S.view.sel.includes(s.id),s.color,()=>{
    S.view.sel=S.view.multi?(S.view.sel.includes(s.id)?S.view.sel.filter(x=>x!==s.id):[...S.view.sel,s.id]):[s.id];upd()}))}
$("multi").onchange=e=>{S.view.multi=e.target.checked;upd()};
$("tot").onchange=e=>{S.view.total=e.target.checked;upd()};
$("lim").onchange=e=>{S.view.limit=e.target.checked;upd()};
function draw(){
  const labels=Array.from({length:S.exams},(_,i)=>"Prüfung "+(i+1));
  const sel=S.subjects.filter(s=>S.view.sel.includes(s.id)&&avgS(s)!==null),one=sel.length===1;
  const ds=sel.map(s=>({label:one?"Gesamtbewertung":s.name,name:s.name,avg:avgS(s),data:gr(s),borderColor:s.color,backgroundColor:s.color+"22",borderWidth:3,pointRadius:3,pointBackgroundColor:"#fff",pointBorderColor:s.color,spanGaps:true,tension:0}));
  if(sel.length>1&&S.view.total!==false)ds.push({label:"Gesamtbewertung",name:"Gesamt",avg:mean(sel.map(avgS)),data:labels.map((_,i)=>mean(sel.map(s=>gv(s,i)).filter(v=>v!==null))),borderColor:css("--tx"),borderWidth:3,borderDash:[2,5],pointRadius:3,spanGaps:true,tension:0});
  if(S.view.limit!==false) ds.push({label:"Genügend / ungenügend (4.0)",isLimit:true,data:labels.map(()=>4),borderColor:"rgba(229,57,53,.45)",borderWidth:1.5,borderDash:[8,6],pointRadius:0,pointHoverRadius:0});
  const tc=css("--mu"),gc=css("--grid");if(chart)chart.destroy();
  chart=new Chart($("cv"),{type:"line",data:{labels,datasets:ds},plugins:[endLabels],options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{right:one?72:118}},
    scales:{y:{min:0.5,max:6.5,ticks:{stepSize:0.5,color:c=>Number.isInteger(c.tick.value)?tc:tc+"aa",callback:v=>v<1||v>6?"":Number.isInteger(v)?v:v.toFixed(1)},grid:{color:c=>Number.isInteger(c.tick.value)?gc:gc+"80"}},x:{ticks:{color:tc},grid:{color:gc}}},plugins:{legend:{labels:{color:tc}}}}});
  const a=one?avgS(sel[0]):mean(sel.map(avgS));
  $("avgTxt").innerHTML="Aktueller Durchschnitt: <b class=\""+cl(a)+"\">"+f1(a)+"</b>"}
/* ---------- Kompensation ---------- */
function komp(){
  const el=$("komp"),ka=S.avgs.find(a=>a.id===S.komp.avg);
  const pool=ka?subsOf(ka):S.subjects,inc=pool.filter(s=>!S.komp.off.includes(s.id)&&zn(s)!==null);
  let h='<div class="row" style="margin-top:10px">Durchschnitt: <select id="kSel"><option value="">Alle Fächer</option>'+S.avgs.map(a=>'<option value="'+a.id+'"'+(a.id===S.komp.avg?" selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div>'
   +'<p class="hint">Diese Fächer werden geprüft (zum Abwählen anklicken):</p><div class="chips">'+pool.map(s=>'<button class="chip'+(S.komp.off.includes(s.id)?"":" on")+'" style="--c:'+s.color+'" data-k="'+s.id+'">'+esc(s.name)+'</button>').join("")+'</div>';
  const fail=inc.filter(s=>zn(s)<4),sur=inc.filter(s=>zn(s)>4);
  if(!fail.length)h+='<p class="ok"><b>Kein geprüftes Fach ist ungenügend – nichts zu kompensieren.</b></p>';
  else{let tm=0;
    fail.forEach(s=>{const m=4-zn(s);tm+=m;
      h+='<div class="kc"><b>'+esc(s.name)+'</b> – Zeugnisnote <b class="bad">'+zn(s).toFixed(1)+'</b> · Mangel <b class="bad">'+m.toFixed(1)+'</b> Punkte'
        +(sur.length?'<ul>'+sur.map(o=>{const p=zn(o)-4;return'<li>'+esc(o.name)+' '+zn(o).toFixed(1)+' (+'+p.toFixed(1)+') – '+(p>=m?'<b class="ok">kompensiert dies allein</b>':'<span class="bad">reicht allein nicht</span>')+'</li>'}).join("")+'</ul>':'<ul><li class="bad">Kein Fach über 4 vorhanden</li></ul>')+'</div>'});
    const tp=sur.reduce((p,s)=>p+zn(s)-4,0);
    h+='<p class="verd '+(tp>=tm?"ok":"bad")+'">Mangel total '+tm.toFixed(1)+' · Pluspunkte total '+tp.toFixed(1)+' → '+(tp>=tm?"alle Mängel können kompensiert werden ✓":"nicht kompensierbar, es fehlen "+(tm-tp).toFixed(1)+" Punkte ✗")+'</p>'}
  el.innerHTML=h;
  $("kSel").onchange=e=>{S.komp.avg=e.target.value;S.komp.off=[];upd()};
  el.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{const id=b.dataset.k;S.komp.off=S.komp.off.includes(id)?S.komp.off.filter(x=>x!==id):[...S.komp.off,id];upd()})}

/* ---------- Tabelle ---------- */
function table(){
  const n=S.exams;$("exN").textContent=n;
  $("th").innerHTML='<tr><th class="nm">Fach</th>'+Array.from({length:n},(_,i)=>'<th>Prüfung '+(i+1)+'</th>').join("")+'<th>Durchschnitt</th><th>Zeugnisnote</th><th>Mangelpunkte</th><th></th></tr>';
  $("tb").innerHTML=S.subjects.map(s=>'<tr><td class="nm"><i class="dot" style="background:'+s.color+'"></i>'+esc(s.name)+'</td>'
    +Array.from({length:n},(_,i)=>'<td><input type="number" step="0.1" min="1" max="6" data-s="'+s.id+'" data-i="'+i+'" value="'+(gv(s,i)??"")+'"></td>').join("")
    +'<td class="a" id="a_'+s.id+'"></td><td class="z" id="z_'+s.id+'"></td><td id="m_'+s.id+'"></td><td><button class="ib x" data-ds="'+s.id+'" title="Fach löschen">✕</button></td></tr>').join("")}
$("tb").oninput=e=>{const el=e.target;if(!el.dataset.s)return;const s=S.subjects.find(x=>x.id===el.dataset.s),i=+el.dataset.i;
  while(s.g.length<=i)s.g.push("");s.g[i]=el.value===""?"":r1(el.value);upd()};
$("tb").onchange=e=>{const el=e.target;if(!el.dataset.s)return;const s=S.subjects.find(x=>x.id===el.dataset.s);el.value=gv(s,+el.dataset.i)??""};
$("tb").onclick=e=>{const b=e.target.closest("button[data-ds]");if(!b)return;
  twoStep(b,"Löschen?",()=>{S.subjects=S.subjects.filter(s=>s.id!==b.dataset.ds);table();upd()})};
function calc(){S.subjects.forEach(s=>{const a=avgS(s),z=zn(s),ea=$("a_"+s.id);if(!ea)return;
  ea.textContent=f1(a);ea.className="a "+cl(a);const ez=$("z_"+s.id);ez.textContent=z===null?"–":z.toFixed(1);ez.className="z "+cl(z);
  const m=$("m_"+s.id);if(a===null){m.textContent="–";m.className=""}else{const p=r1(4-r1(a));m.textContent=p.toFixed(1);m.className=p>0?"bad":"ok"}})}
$("exMin").onclick=()=>{if(S.exams>1){S.exams--;table();upd()}};
$("exPlus").onclick=()=>{if(S.exams<10){S.exams++;table();upd()}};
$("addSub").onclick=()=>{const i=$("newN"),n=i.value.trim();if(!n)return;
  if(S.subjects.some(s=>s.name.toLowerCase()===n.toLowerCase())){i.value="";i.placeholder="Fach existiert schon";return}
  const s=addSubject(n);S.view.sel=S.view.multi?[...S.view.sel,s.id]:[s.id];i.value="";i.placeholder="Neues Fach, z. B. M123";table();upd()};
$("newN").onkeydown=e=>{if(e.key==="Enter")$("addSub").click()};
$("reset").onclick=()=>modal("Zurücksetzen","<p>Was soll zurückgesetzt werden?</p><p class=\"hint\">Fächer und Durchschnitte können auch mit gelöscht werden.</p>",[
  {t:"Abbrechen"},
  {t:"Nur Noten löschen",fn:()=>{S.subjects.forEach(s=>s.g=[]);table();upd()}},
  {t:"Alles löschen",cls:"dan",fn:()=>{S.subjects=[];S.avgs=[];S.view.sel=[];S.komp={avg:"",off:[]};S.nc=0;table();upd()}}]);

/* ---------- Presets ---------- */
const lib=()=>{try{return JSON.parse(localStorage.getItem(PKEY)||"[]")}catch(e){return[]}};
const saveLib=l=>{try{localStorage.setItem(PKEY,JSON.stringify(l))}catch(e){}};
function makePreset(name,withG){return{format:"notenrechner-preset",v:2,name,exams:S.exams,withGrades:withG,
  subjects:S.subjects.map(s=>({name:s.name,color:s.color,g:withG?s.g.slice(0,S.exams):[]})),
  averages:S.avgs.map(a=>({name:a.name,mp:a.mp!==false,subjects:subsOf(a).map(s=>s.name)}))}}
const validPreset=p=>p&&p.format==="notenrechner-preset"&&typeof p.name==="string"&&Array.isArray(p.subjects)&&Array.isArray(p.averages);
function addToLib(p){const l=lib().filter(x=>x.name!==p.name);l.push(p);saveLib(l)}
function applyPreset(p){S.nc=0;S.exams=Math.min(10,Math.max(1,(p.exams|0)||4));S.subjects=[];
  p.subjects.forEach(x=>{const s=addSubject(String(x.name).slice(0,14),x.g||[]);if(/^#[0-9a-f]{6}$/i.test(x.color||""))s.color=x.color});
  S.avgs=p.averages.map(a=>({id:uid(),name:String(a.name).slice(0,20),mp:a.mp!==false,subs:S.subjects.filter(s=>(a.subjects||[]).includes(s.name)).map(s=>s.id)}));
  S.view.sel=S.subjects[0]?[S.subjects[0].id]:[];S.komp={avg:"",off:[]};table();upd()}
async function saveFile(name,text){
  const filename=name.replace(/[^\w\- äöüÄÖÜéèà]/g,"_").trim()+".json";
  try{const d=window.claude&&claude.use?await claude.use("downloads"):null;
    if(d){await d.save({filename,data:text});return}}catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}
function renderPresets(){const l=lib();
  $("plist").innerHTML=l.length?l.map((p,i)=>'<div class="pl"><div><b>'+esc(p.name)+'</b><br><small>'+p.subjects.length+' Fächer · '+p.averages.length+' Durchschnitte · '+(p.exams||4)+' Prüfungen'+(p.withGrades?' · mit Noten':'')+'</small></div>'
    +'<div class="row"><button class="b pri" data-l="'+i+'">Laden</button><button class="b" data-f="'+i+'">Als Datei</button><button class="ib x" data-x="'+i+'" title="Aus Liste löschen">✕</button></div></div>').join(""):'<p class="hint">Noch keine Presets in der Liste. Speichere das aktuelle oder lade eine Datei bzw. einen Ordner.</p>'}
$("plist").onclick=e=>{const b=e.target.closest("button");if(!b)return;const l=lib();
  if(b.dataset.l!==undefined){const p=l[+b.dataset.l];modal("Preset laden","<p>«"+esc(p.name)+"» ersetzt deine aktuellen Fächer und Durchschnitte"+(p.withGrades?" und Noten":"; die Noten werden leer")+".</p>",[{t:"Abbrechen"},{t:"Laden",cls:"pri",fn:()=>applyPreset(p)}])}
  else if(b.dataset.f!==undefined){const p=l[+b.dataset.f];saveFile(p.name,JSON.stringify(p,null,2))}
  else if(b.dataset.x!==undefined)twoStep(b,"Löschen?",()=>{l.splice(+b.dataset.x,1);saveLib(l);renderPresets()})};
$("pSave").onclick=()=>modal("Preset speichern",'<label class="fl">Name des Presets<input type="text" id="pN" maxlength="40" value="Mein Preset"></label><p><label><input type="checkbox" id="pG"> Noten mitspeichern</label></p><p class="bad" id="pErr"></p>',[
  {t:"Abbrechen"},
  {t:"Nur in Liste",fn:()=>{const n=$("pN").value.trim();if(!n){$("pErr").textContent="Bitte einen Namen eingeben.";return false}addToLib(makePreset(n,$("pG").checked));renderPresets()}},
  {t:"Als Datei speichern",cls:"pri",fn:()=>{const n=$("pN").value.trim();if(!n){$("pErr").textContent="Bitte einen Namen eingeben.";return false}const p=makePreset(n,$("pG").checked);addToLib(p);renderPresets();saveFile(n,JSON.stringify(p,null,2))}}]);
async function importFiles(files){let ok=0,bad=0,seen=0;
  for(const f of files){if(!/\.json$/i.test(f.name))continue;seen++;try{const p=JSON.parse(await f.text());if(validPreset(p)){addToLib(p);ok++}else bad++}catch(e){bad++}}
  $("pmsg").textContent=seen?ok+" Preset(s) importiert"+(bad?", "+bad+" Datei(en) übersprungen (kein gültiges Preset)":"")+".":"Keine .json-Dateien gefunden.";renderPresets()}
$("pFile").onclick=()=>$("fileIn").click();$("pDir").onclick=()=>$("dirIn").click();
$("fileIn").onchange=e=>{importFiles([...e.target.files]);e.target.value=""};
$("dirIn").onchange=e=>{importFiles([...e.target.files]);e.target.value=""};

/* ---------- Start ---------- */
function upd(){sync();save();chips();tiles();draw();calc();komp()}
table();upd();renderPresets();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
</script></body></html>
